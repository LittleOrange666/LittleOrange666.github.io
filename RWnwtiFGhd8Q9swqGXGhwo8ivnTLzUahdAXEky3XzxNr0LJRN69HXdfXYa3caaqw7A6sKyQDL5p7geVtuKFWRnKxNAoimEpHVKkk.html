<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青蛙呱呱 模型模擬器</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #1e1e1e;
            color: #eeeeee;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-top: 0; }
        .control-panel {
            background: #2d2d2d;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
            max-width: 800px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }
        button:hover { background-color: #45a049; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        button.action-btn { background-color: #2196F3; }
        button.action-btn:hover { background-color: #1976D2; }
        button.danger-btn { background-color: #f44336; }
        button.danger-btn:hover { background-color: #d32f2f; }

        .stats {
            font-size: 18px;
            font-weight: bold;
            color: #ffeb3b;
            margin-left: 10px;
        }

        #grid-container {
            display: grid;
            gap: 2px;
            background-color: #444;
            padding: 4px;
            border-radius: 6px;
            border: 2px solid #555;
        }
        .cell {
            width: 50px;
            height: 50px;
            background-color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.1s;
            position: relative;
        }
        .cell:hover { background-color: #4a4a4a; }
        /* 使用偽元素顯示箭頭，方便旋轉動畫 */
        .cell .arrow {
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .cell.active {
            background-color: #ff9800;
            color: #fff;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .cell.start-point::after {
            content: '';
            position: absolute;
            top: 2px; right: 2px; bottom: 2px; left: 2px;
            border: 2px dashed #4CAF50;
            pointer-events: none;
        }

        .instructions {
            margin-top: 20px;
            color: #aaa;
            font-size: 14px;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<h1>青蛙呱呱 模型模擬器</h1>

<div class="control-panel">
    <div>
        <label for="gridSize">網格大小 N:</label>
        <input type="number" id="gridSize" value="4" min="3" max="20" style="width: 50px;">
    </div>
    <button onclick="initGrid()">產生空網格</button>
    <button onclick="loadOptimal()" style="background-color: #9C27B0;">載入最佳解</button>
    <button onclick="importSolution()" style="background-color: #FF9800;">匯入解答</button>
    <button onclick="exportSolution()" style="background-color: #795548;">匯出解答</button>

    <div style="width: 100%; border-bottom: 1px solid #555; margin: 5px 0;"></div>

    <button id="btnStep" class="action-btn" onclick="step()">單步執行</button>
    <button id="btnPlay" class="action-btn" onclick="togglePlay()">自動播放</button>
    <button id="btnReset" class="danger-btn" onclick="resetSimulation()">重置狀態</button>

    <div>
        速度: <input type="range" id="speedSlider" min="10" max="500" value="150" dir="rtl">
    </div>

    <div class="stats">
        步數: <span id="stepCount">0</span> | 狀態: <span id="statusText" style="color:#4CAF50;">準備就緒</span>
    </div>
</div>

<div id="grid-container"></div>

<div class="instructions">
    <b>操作說明：</b><br>
    [左鍵點擊] 格子可順時針旋轉初始方向<br>
    [Shift + 左鍵點擊] 可設定該格為「起始觸發點」<br>
    注意模擬過程中不可操作，需要先按重置<br>
</div>

<!-- IO Modal -->
<div id="ioModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:#2d2d2d; padding:20px; border-radius:8px; box-shadow:0 4px 6px rgba(0,0,0,0.3); width:320px; display:flex; flex-direction:column; gap:10px;">
        <h3 id="ioModalTitle" style="margin:0; color:#eeeeee;">匯入解答</h3>
        <textarea id="ioTextarea" rows="10" style="background:#1e1e1e; color:#eeeeee; border:1px solid #555; border-radius:4px; padding:8px; font-family:monospace; resize:vertical; white-space:pre;" placeholder="在此貼上解答..."></textarea>
        <div style="display:flex; justify-content:flex-end; gap:10px;">
            <button onclick="document.getElementById('ioModal').style.display='none'" style="background-color:#555;">取消 / 關閉</button>
            <button id="ioModalActionBtn" class="action-btn">確定匯入</button>
        </div>
    </div>
</div>

<script>
    // 0:上, 1:右, 2:下, 3:左
    const DIRS = [[-1, 0], [0, 1], [1, 0], [0, -1]];
    let n = 4;
    let grid = []; // 儲存每個格子的方向 0~3
    let initialGrid = []; // 儲存初始狀態
    let startR = 1, startC = 1;

    // 模擬狀態
    let currR = -1, currC = -1;
    let steps = 0;
    let isPlaying = false;
    let playTimer = null;
    let isFinished = false;

    const container = document.getElementById('grid-container');
    const stepCountEl = document.getElementById('stepCount');
    const statusTextEl = document.getElementById('statusText');
    const btnPlay = document.getElementById('btnPlay');
    const btnStep = document.getElementById('btnStep');

    // 初始化網格資料與 DOM
    function initGrid(presetGrid = null, presetStartR = 0, presetStartC = 0) {
        stopPlay();
        n = parseInt(document.getElementById('gridSize').value);
        container.style.gridTemplateColumns = `repeat(${n}, 50px)`;
        container.innerHTML = '';

        grid = [];
        initialGrid = [];
        startR = presetStartR;
        startC = presetStartC;

        for (let r = 0; r < n; r++) {
            let row = [];
            let initialRow = [];
            for (let c = 0; c < n; c++) {
                // 預設朝上(0)，若有 preset 則載入
                let dir = presetGrid ? presetGrid[r][c] : 0;
                row.push(dir);
                initialRow.push(dir);

                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r}-${c}`;

                let arrow = document.createElement('div');
                arrow.className = 'arrow';
                arrow.innerHTML = '↑';
                arrow.style.transform = `rotate(${dir * 90}deg)`;

                cell.appendChild(arrow);

                // 點擊事件綁定
                cell.addEventListener('click', (e) => {
                    if (isPlaying || steps > 0) return; // 模擬中不可更改

                    if (e.shiftKey) {
                        // 設定起點
                        setStartPoint(r, c);
                        resetSimulation(); // 立即更新畫面狀態
                    } else {
                        // 旋轉方向
                        initialGrid[r][c] = (initialGrid[r][c] + 1) % 4;
                        grid[r][c] = initialGrid[r][c];
                        arrow.style.transform = `rotate(${grid[r][c] * 90}deg)`;
                    }
                });

                container.appendChild(cell);
            }
            grid.push(row);
            initialGrid.push(initialRow);
        }

        resetSimulation();
    }

    // 設定起始點並更新 UI
    function setStartPoint(r, c) {
        document.querySelectorAll('.cell').forEach(el => el.classList.remove('start-point'));
        startR = r;
        startC = c;
        document.getElementById(`cell-${r}-${c}`).classList.add('start-point');
    }

    // 載入最佳解
    function loadOptimal() {
        window.alert("哈哈哈不告訴你");
        /*
        let n = +document.getElementById('gridSize').value;
        const optimalGrid = [];
        for(let i = 0;i<n;i++){
            optimalGrid.push([]);
            for(let j = 0;j<n;j++){
                optimalGrid[i].push(0);
            }
        }
        */
        /*
        do somthing ?
        */
        // let x = ???
        // let y = ???
        // initGrid(optimalGrid, n2, n2);
    }

    // 重置模擬狀態到第 0 步
    function resetSimulation() {
        stopPlay();
        isFinished = false;
        steps = 0;
        currR = startR;
        currC = startC;
        stepCountEl.innerText = steps;
        statusTextEl.innerText = "準備就緒";
        statusTextEl.style.color = "#4CAF50";

        // 恢復初始箭頭方向與移除 highlight
        for (let r = 0; r < n; r++) {
            for (let c = 0; c < n; c++) {
                grid[r][c] = initialGrid[r][c];
                let cell = document.getElementById(`cell-${r}-${c}`);
                cell.classList.remove('active');
                let arrowEl = cell.querySelector('.arrow');
                arrowEl.removeAttribute('data-rot');
                arrowEl.style.transform = `rotate(${grid[r][c] * 90}deg)`;
            }
        }
        setStartPoint(startR, startC);
        document.getElementById(`cell-${currR}-${currC}`).classList.add('active');

        btnStep.disabled = false;
    }

    // 核心邏輯：執行一步
    function step() {
        if (isFinished) return;

        // 1. 取得當前格子方向並旋轉 90 度
        let dir = grid[currR][currC];
        dir = (dir + 1) % 4;
        grid[currR][currC] = dir;

        // 更新畫面中的箭頭
        let currentCell = document.getElementById(`cell-${currR}-${currC}`);
        currentCell.classList.remove('active');

        // 處理旋轉動畫的連續性 (避免 270->0 逆轉)
        // 這裡直接加上角度來保持順時針動畫
        let arrowEl = currentCell.querySelector('.arrow');
        let currentRotation = arrowEl.getAttribute('data-rot') || (dir - 1) * 90;
        let newRotation = parseInt(currentRotation) + 90;
        arrowEl.setAttribute('data-rot', newRotation);
        arrowEl.style.transform = `rotate(${newRotation}deg)`;

        // 2. 移動到下一格
        currR += DIRS[dir][0];
        currC += DIRS[dir][1];
        steps++;
        stepCountEl.innerText = steps;

        // 3. 檢查是否出界
        if (currR < 0 || currR >= n || currC < 0 || currC >= n) {
            isFinished = true;
            stopPlay();
            statusTextEl.innerText = "訊號溢出，模擬結束";
            statusTextEl.style.color = "#f44336";
            btnStep.disabled = true;
        } else {
            document.getElementById(`cell-${currR}-${currC}`).classList.add('active');
            statusTextEl.innerText = "運行中...";
            statusTextEl.style.color = "#2196F3";
        }
    }

    // 播放控制
    function togglePlay() {
        if (isFinished) resetSimulation();

        if (isPlaying) {
            stopPlay();
        } else {
            isPlaying = true;
            btnPlay.innerText = "暫停";
            btnPlay.style.backgroundColor = "#ff9800";
            btnStep.disabled = true;
            loop();
        }
    }

    function stopPlay() {
        isPlaying = false;
        btnPlay.innerText = "自動播放";
        btnPlay.style.backgroundColor = "#2196F3";
        btnStep.disabled = isFinished;
        clearTimeout(playTimer);
    }

    function loop() {
        if (!isPlaying || isFinished) return;
        step();
        let speed = document.getElementById('speedSlider').value;
        playTimer = setTimeout(loop, speed);
    }

    // 匯入匯出解答功能
    function exportSolution() {
        const charMap = ['^', '>', 'v', '<'];
        let lines = [];
        for (let r = 0; r < n; r++) {
            let rowStr = '';
            for (let c = 0; c < n; c++) {
                rowStr += charMap[initialGrid[r][c]];
            }
            lines.push(rowStr);
        }
        lines.push(`${startR + 1} ${startC + 1}`);
        const exportString = lines.join('\n');

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(exportString).then(() => {
                alert('解答已複製到剪貼簿！');
            }).catch(err => {
                showExportModal(exportString);
            });
        } else {
            showExportModal(exportString);
        }
    }

    function showExportModal(text) {
        document.getElementById('ioModalTitle').innerText = '複製解答';
        document.getElementById('ioTextarea').value = text;
        document.getElementById('ioTextarea').readOnly = true;
        document.getElementById('ioModalActionBtn').style.display = 'none';
        document.getElementById('ioModal').style.display = 'flex';
        document.getElementById('ioTextarea').select();
    }

    function importSolution() {
        document.getElementById('ioModalTitle').innerText = '匯入解答';
        document.getElementById('ioTextarea').value = '';
        document.getElementById('ioTextarea').readOnly = false;
        document.getElementById('ioModalActionBtn').style.display = 'block';
        document.getElementById('ioModalActionBtn').innerText = '確定匯入';
        document.getElementById('ioModalActionBtn').onclick = doImport;
        document.getElementById('ioModal').style.display = 'flex';
        document.getElementById('ioTextarea').focus();
    }

    function doImport() {
        const inputString = document.getElementById('ioTextarea').value;
        if (!inputString) return;
        try {
            const lines = inputString.trim().split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (lines.length < 2) throw new Error();
            
            const parsedN = lines.length - 1;
            const posLine = lines[parsedN].split(/\s+/);
            if (posLine.length !== 2) throw new Error();
            
            const importedStartR = parseInt(posLine[0]) - 1;
            const importedStartC = parseInt(posLine[1]) - 1;
            
            let newGrid = [];
            for (let r = 0; r < parsedN; r++) {
                let rowStr = lines[r];
                if (rowStr.length !== parsedN) throw new Error();
                let row = [];
                for (let c = 0; c < parsedN; c++) {
                    const char = rowStr[c];
                    if (char === '^') row.push(0);
                    else if (char === '>') row.push(1);
                    else if (char === 'v' || char === 'V') row.push(2);
                    else if (char === '<') row.push(3);
                    else throw new Error();
                }
                newGrid.push(row);
            }
            
            document.getElementById('gridSize').value = parsedN;
            initGrid(newGrid, importedStartR, importedStartC);
            document.getElementById('ioModal').style.display = 'none';
        } catch (e) {
            alert('解析失敗，請確認格式正確（N行字元 + 1行座標）');
        }
    }

    // 初始化預設畫面
    initGrid();

</script>
</body>
</html>
