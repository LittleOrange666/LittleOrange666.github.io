<!DOCTYPE html>
<html>
<head>
    <title>Robot Arm v3.8.1</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; background: #050505; color: #00ff00; }
        #ui { 
            position: absolute; top: 10px; left: 10px; z-index: 10; 
            background: rgba(0,0,0,0.95); padding: 15px; 
            border: 2px solid #00ff00; width: 420px; 
            box-shadow: 0 0 20px #00ff00; 
        }
        #ui.fail-ui { border-color: #ff0000 !important; box-shadow: 0 0 40px #ff0000 !important; }
        #log { 
            color: #ffffff; height: 60px; font-size: 18px; 
            border: 1px solid #00ff00; padding: 8px; margin-bottom: 10px; 
            background: #111; display: flex; align-items: center;
        }
        .fail-log { border-color: #ff0000 !important; color: #ff0000 !important; }
        textarea { width: 100%; height: 200px; background: #000; color: #00ff00; border: 1px solid #00ff00; font-family: 'Courier New', monospace; font-size: 14px; margin: 10px 0; outline: none; }
        button { width: 100%; background: #00ff00; color: #000; border: none; padding: 12px; cursor: pointer; font-weight: bold; font-family: 'Courier New', monospace; font-size: 16px; }
        .stat-panel { font-size: 12px; border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 5px; display: flex; justify-content: space-between; }
        #status { color: yellow; margin-top: 10px; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>
    <div id="ui">
        <div style="font-weight:bold; font-size:18px; margin-bottom:10px;">SAT COLLISION v3.8.1</div>
        <div id="log">SYSTEM READY</div>
        <div class="stat-panel"><span>TIME: <span id="clock-display">0.00</span>s</span></div>
        <textarea id="commands">
MOVE_JOINT 2 +40
MOVE_JOINT 1 +90
WAIT 500
GRAB
MOVE_JOINT 2 -20</textarea>
        <button onclick="executeMission()">EXECUTE MISSION</button>
        <div id="status">STACKING: 0/3 CORRECT</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const scene = new THREE.Scene();
        const clock = new THREE.Clock();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);

        // --- 場景佈置 ---
        scene.add(new THREE.GridHelper(30, 30, 0x222222, 0x111111));
        const light = new THREE.DirectionalLight(0xffffff, 1.2);
        light.position.set(5, 15, 5); scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));

        // --- 機器手臂模型結構 ---
        const armMat = new THREE.MeshPhongMaterial({ color: 0x00ff00 });
        const baseGroup = new THREE.Group(); scene.add(baseGroup);
        const j1 = new THREE.Group(); baseGroup.add(j1);
        const l1 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1, 1.2), armMat); l1.position.y = 0.5; j1.add(l1);
        
        const j2 = new THREE.Group(); j2.position.y = 1; j1.add(j2);
        const l2 = new THREE.Mesh(new THREE.BoxGeometry(0.6, 3, 0.6), armMat); l2.position.y = 1.5; j2.add(l2);
        
        const j3 = new THREE.Group(); j3.position.y = 3; j2.add(j3);
        const l3 = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.5, 0.4), armMat); l3.position.y = 1.25; j3.add(l3);
        
        const effector = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({color:0xff0000}));
        effector.position.y = 2.5; j3.add(effector);

        // --- 環境與物體 ---
        const goalPlatform = new THREE.Mesh(new THREE.BoxGeometry(2, 1.5, 2), new THREE.MeshPhongMaterial({color: 0x333333}));
        goalPlatform.position.set(-3, 0.75, -3); scene.add(goalPlatform);

        const wall = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 0.4), new THREE.MeshPhongMaterial({color: 0xaa0000, transparent: true, opacity: 0.5}));
        wall.position.set(-1, 2, -1.5); scene.add(wall);

        const floor = new THREE.Mesh(new THREE.BoxGeometry(30, 0.2, 30), new THREE.MeshBasicMaterial({visible: false}));
        floor.position.y = -0.11; scene.add(floor); 

        const blocks = [];
        const createBlock = (id, color, pos) => {
            const b = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshPhongMaterial({color}));
            b.position.copy(pos); 
            b.userData = { id, startPos: pos.clone(), held: false, hasBeenGrabbed: false };
            scene.add(b); blocks.push(b); return b;
        };
        const b1 = createBlock(1, 0x0088ff, new THREE.Vector3(3, 0.25, 3));
        const b2 = createBlock(2, 0xffaa00, new THREE.Vector3(4, 0.25, 0));
        const b3 = createBlock(3, 0xff00ff, new THREE.Vector3(0, 2, 4));

        camera.position.set(10, 10, 10);

        // --- 3D SAT 碰撞檢測核心 ---
        function getOBB(mesh) {
            mesh.updateMatrixWorld();
            const transform = mesh.matrixWorld;
            const params = mesh.geometry.parameters;
            const halfSize = new THREE.Vector3(params.width/2, params.height/2, params.depth/2);
            const center = new THREE.Vector3().setFromMatrixPosition(transform);
            const axes = [
                new THREE.Vector3(1, 0, 0).applyMatrix4(new THREE.Matrix4().extractRotation(transform)).normalize(),
                new THREE.Vector3(0, 1, 0).applyMatrix4(new THREE.Matrix4().extractRotation(transform)).normalize(),
                new THREE.Vector3(0, 0, 1).applyMatrix4(new THREE.Matrix4().extractRotation(transform)).normalize()
            ];
            return { center, axes, halfSize };
        }

        function checkOBBCollision(obbA, obbB) {
            const relPos = new THREE.Vector3().subVectors(obbB.center, obbA.center);
            const axes = [];
            for (let i = 0; i < 3; i++) { axes.push(obbA.axes[i]); axes.push(obbB.axes[i]); }
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 3; j++) {
                    const cross = new THREE.Vector3().crossVectors(obbA.axes[i], obbB.axes[j]);
                    if (cross.lengthSq() > 1e-6) axes.push(cross.normalize());
                }
            }
            const EPSILON = 0.01;
            for (const L of axes) {
                const rA = obbA.halfSize.x * Math.abs(obbA.axes[0].dot(L)) +
                           obbA.halfSize.y * Math.abs(obbA.axes[1].dot(L)) +
                           obbA.halfSize.z * Math.abs(obbA.axes[2].dot(L));
                const rB = obbB.halfSize.x * Math.abs(obbB.axes[0].dot(L)) +
                           obbB.halfSize.y * Math.abs(obbB.axes[1].dot(L)) +
                           obbB.halfSize.z * Math.abs(obbB.axes[2].dot(L));
                const dist = Math.abs(relPos.dot(L));
                if (dist > (rA + rB - EPSILON)) return false; 
            }
            return true; 
        }

        // --- 狀態管理與動畫循環 ---
        let simTime = 0, isRunning = false, isFailed = false, sequenceFinished = false, heldObject = null, activeMissionId = 0;
        let armTarget = { j1: 0, j2: 0, j3: 0 }, currentArm = { j1: 0, j2: 0, j3: 0 };

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (!isFailed) {
                if (isRunning && !sequenceFinished) {
                    simTime += delta;
                    document.getElementById('clock-display').innerText = simTime.toFixed(2);
                }

                // 關節插值與旋轉
                currentArm.j1 = THREE.MathUtils.lerp(currentArm.j1, armTarget.j1, 0.1);
                currentArm.j2 = THREE.MathUtils.lerp(currentArm.j2, armTarget.j2, 0.1);
                currentArm.j3 = THREE.MathUtils.lerp(currentArm.j3, armTarget.j3, 0.1);
                j1.rotation.y = currentArm.j1; j2.rotation.z = currentArm.j2; j3.rotation.z = currentArm.j3;

                // 物體移動動畫與抓取邏輯
                if (!b2.userData.held && !b2.userData.hasBeenGrabbed) b2.position.x = 4 + 2 * Math.sin(simTime * 1.5);
                if (!b3.userData.held && !b3.userData.hasBeenGrabbed) {
                    b3.position.x = 1.5 * Math.cos(simTime * 1.2); b3.position.y = 2 + 1.5 * Math.sin(simTime * 1.2); b3.position.z = 4;
                }
                if (heldObject) {
                    const worldPos = new THREE.Vector3(); effector.getWorldPosition(worldPos);
                    heldObject.position.copy(worldPos);
                    heldObject.quaternion.copy(effector.getWorldQuaternion(new THREE.Quaternion()));
                } 
                
                // 重力與簡單堆疊物理
                blocks.forEach(b => {
                    if (!b.userData.held) {
                        b.rotation.set(0, b.rotation.y, 0);
                        let groundY = (Math.abs(b.position.x + 3) < 1 && Math.abs(b.position.z + 3) < 1) ? 1.75 : 0.25;
                        blocks.forEach(other => { 
                            if (b !== other && !other.userData.held && Math.abs(b.position.x - other.position.x) < 0.3 && b.position.y > other.position.y) groundY = Math.max(groundY, other.position.y + 0.5); 
                        });
                        if (b.position.y > groundY) b.position.y -= 0.1; else b.position.y = groundY;
                    }
                });

                // 碰撞監控
                if (isRunning) {
                    const colliders = [l2, l3, effector], obsList = [wall, goalPlatform, floor];
                    colliders.forEach(c => {
                        const obbC = getOBB(c);
                        obsList.forEach(o => { if (checkOBBCollision(obbC, getOBB(o))) triggerFail("CRITICAL ARM COLLISION"); });
                    });
                    blocks.forEach(b => {
                        const obbB = getOBB(b);
                        if (checkOBBCollision(obbB, getOBB(wall))) triggerFail("BLOCK HIT WALL");
                        blocks.forEach(other => {
                            if (b !== other && !b.userData.held && !other.userData.held) {
                                if (checkOBBCollision(obbB, getOBB(other)) && Math.abs(b.position.y - other.position.y) < 0.1) triggerFail("BLOCKS COLLIDED");
                            }
                        });
                    });
                }
                checkStackingLogic();
            }
            controls.update(); renderer.render(scene, camera);
        }

        // --- 2D SAT 堆疊判定邏輯 ---
        function checkStackingLogic() {
            if (b1.userData.held || b2.userData.held || b3.userData.held) {
                document.getElementById('status').innerText = "STATUS: OBJECTS HELD";
                return;
            }

            function getXZCorners(mesh) {
                mesh.updateMatrixWorld();
                const w = mesh.geometry.parameters.width / 2, d = mesh.geometry.parameters.depth / 2;
                const corners = [new THREE.Vector3(w, 0, d), new THREE.Vector3(w, 0, -d), new THREE.Vector3(-w, 0, -d), new THREE.Vector3(-w, 0, d)];
                return corners.map(v => v.applyMatrix4(mesh.matrixWorld));
            }

            function checkProjectedOverlap(meshA, meshB) {
                const polyA = getXZCorners(meshA), polyB = getXZCorners(meshB);
                const getAxes = (poly) => {
                    const e1 = new THREE.Vector2(poly[1].x - poly[0].x, poly[1].z - poly[0].z).normalize();
                    const e2 = new THREE.Vector2(poly[2].x - poly[1].x, poly[2].z - poly[1].z).normalize();
                    return [new THREE.Vector2(-e1.y, e1.x), new THREE.Vector2(-e2.y, e2.x)];
                };
                const axes = [...getAxes(polyA), ...getAxes(polyB)];
                for (let axis of axes) {
                    let minA = Infinity, maxA = -Infinity, minB = Infinity, maxB = -Infinity;
                    for (let p of polyA) { const proj = p.x * axis.x + p.z * axis.y; minA = Math.min(minA, proj); maxA = Math.max(maxA, proj); }
                    for (let p of polyB) { const proj = p.x * axis.x + p.z * axis.y; minB = Math.min(minB, proj); maxB = Math.max(maxB, proj); }
                    if (maxA < minB || maxB < minA) return false;
                }
                return true;
            }

            function isStackedOn(bottom, top) {
                const targetDiff = (bottom.geometry.parameters.height + top.geometry.parameters.height) / 2;
                return Math.abs(top.position.y - bottom.position.y - targetDiff) < 0.15 && checkProjectedOverlap(bottom, top);
            }

            let score = 0;
            if (isStackedOn(goalPlatform, b1)) { score = 1; if (isStackedOn(b1, b2)) { score = 2; if (isStackedOn(b2, b3)) score = 3; } }
            document.getElementById('status').innerText = `STACKING: ${score}/3 CORRECT`;
        }

        // --- 任務控制與執行 ---
        function triggerFail(msg) {
            isFailed = true; isRunning = false;
            const logEl = document.getElementById('log'); logEl.innerText = msg; logEl.classList.add('fail-log');
            document.getElementById('ui').classList.add('fail-ui');
        }

        function resetImmediate() {
            simTime = 0; isFailed = false; sequenceFinished = false; isRunning = false; heldObject = null;
            armTarget = { j1: 0, j2: 0, j3: 0 }; currentArm = { j1: 0, j2: 0, j3: 0 };
            const logEl = document.getElementById('log'); logEl.classList.remove('fail-log'); logEl.innerText = "SYSTEM REBOOTED";
            document.getElementById('ui').classList.remove('fail-ui');
            blocks.forEach(b => { b.position.copy(b.userData.startPos); b.rotation.set(0,0,0); b.userData.held = false; b.userData.hasBeenGrabbed = false; });
        }

        async function executeMission() {
            const missionId = ++activeMissionId; resetImmediate();
            await new Promise(r => setTimeout(r, 200)); 
            const lines = document.getElementById('commands').value.split('\n');
            isRunning = true;

            for (let line of lines) {
                if (missionId !== activeMissionId || isFailed) break;
                const raw = line.trim(); if (!raw || raw.startsWith("//")) continue;
                const parts = raw.split(/\s+/), cmd = parts[0].toUpperCase();
                document.getElementById('log').innerText = `EXEC: ${cmd}...`;

                if (cmd === 'MOVE_JOINT') {
                    const delta = parseFloat(parts.slice(2).join('')) * Math.PI / 180;
                    if (parts[1] === '1') armTarget.j1 += delta;
                    else if (parts[1] === '2') armTarget.j2 += delta;
                    else if (parts[1] === '3') armTarget.j3 += delta;
                    await new Promise(r => setTimeout(r, 1200));
                } else if (cmd === 'WAIT') {
                    await new Promise(r => setTimeout(r, parseInt(parts[1])));
                } else if (cmd === 'GRAB') {
                    const effPos = new THREE.Vector3(); effector.getWorldPosition(effPos);
                    let closest = null, minDist = 0.8;
                    blocks.forEach(b => { const d = effPos.distanceTo(b.position); if (d < minDist) { minDist = d; closest = b; } });
                    if (closest) { heldObject = closest; heldObject.userData.held = true; heldObject.userData.hasBeenGrabbed = true; }
                    await new Promise(r => setTimeout(r, 500));
                } else if (cmd === 'RELEASE') {
                    if (heldObject) heldObject.userData.held = false; heldObject = null;
                    await new Promise(r => setTimeout(r, 500));
                }
            }
            if (missionId === activeMissionId && !isFailed) { sequenceFinished = true; document.getElementById('log').innerText = "MISSION COMPLETE"; }
        }

        animate();
    </script>
</body>
</html>
